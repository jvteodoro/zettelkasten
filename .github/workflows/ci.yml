name: CI
on:
  push:
    branches: [main, "docs/**", "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate hook syntax and handoff
        shell: bash
        run: |
          set -euo pipefail
          sh -n .githooks/pre-commit
          sh -n .githooks/pre-push
          bash -n scripts/install-git-hooks.sh
          test -f AGENTS.md
          for i in $(seq -w 0 12); do
            compgen -G "docs/${i}-*.md" >/dev/null || { echo "Missing docs/${i}-*.md"; exit 1; }
          done
          find .agents/skills -name SKILL.md -type f | grep -q .
  java:
    runs-on: ubuntu-latest
    needs: structure
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify active JDK 25
        shell: bash
        run: |
          java -version
          test "$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.specification.version = //p' | head -n1)" = "25"
      - name: Maven verify
        run: mvn -B verify
      - name: Packaged CLI offline archive smoke test
        shell: bash
        run: |
          set -euo pipefail
          archive_dir=$(mktemp -d)
          trap 'rm -rf "$archive_dir"' EXIT
          app=target/zettelkasten-0.1.0-SNAPSHOT-all.jar
          test -f "$app"
          javap -verbose -classpath "$app" org.zettelkasten.cli.Main | grep -q 'major version: 69'
          java -jar "$app" --help
          java -jar "$app" --version
          java -jar "$app" init --db "$archive_dir/source.db"
          java -jar "$app" doctor --db "$archive_dir/source.db"
          java -jar "$app" backup --db "$archive_dir/source.db" --out "$archive_dir/backup.db"
          java -jar "$app" restore --from "$archive_dir/backup.db" --db "$archive_dir/restored.db"
          java -jar "$app" export --db "$archive_dir/source.db" --out "$archive_dir/export"
          java -jar "$app" graph-export --db "$archive_dir/source.db" --out "$archive_dir/graph"
          java -jar "$app" import-archive --from "$archive_dir/export" --db "$archive_dir/imported.db"
          java -jar "$app" doctor --db "$archive_dir/imported.db"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-failsafe-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
